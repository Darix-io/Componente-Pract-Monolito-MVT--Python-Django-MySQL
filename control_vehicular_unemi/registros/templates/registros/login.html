<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Seguridad - UNEMI</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        .login-container h2 { 
            color: #1a365d; 
            margin-bottom: 10px; 
        }
        .login-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #333; 
            font-weight: bold; 
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        .btn-login { 
            background-color: #fdb913; /* Amarillo UNEMI */
            color: #1a365d; /* Azul UNEMI */
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background-color 0.3s; 
        }
        .btn-login:hover { 
            background-color: #e5a710; 
        }
        .error-message { 
            color: #dc3545; 
            background-color: #f8d7da; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Control Vehicular</h2>
        <p>Módulo de Seguridad - UNEMI</p>

        {% if form.errors %}
            <div class="error-message">
                Usuario o contraseña incorrectos. Por favor, intente de nuevo.
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuario:</label>
                <input type="text" name="username" id="id_username" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
            
            <input type="hidden" name="next" value="{% url 'dashboard_guardia' %}">
        </form>
    </div>

</body>
</html>
