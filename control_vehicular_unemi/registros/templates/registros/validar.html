<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Punto de Control - Escáner</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #343a40; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; color: #333; }
        input, select, button { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        .btn-validar { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Punto de Control Vehicular</h2>
        <form method="POST" action="{% url 'validar_acceso' %}">
            {% csrf_token %}
            <input type="text" name="placa" placeholder="Pega el token aquí" required>
            <select name="tipo">
                <option value="Entrada">Registrar Entrada</option>
                <option value="Salida">Registrar Salida</option>
            </select>
            <button type="submit" class="btn-validar">Validar Acceso</button>
        </form>
        <a href="{% url 'dashboard_guardia' %}" style="color: #0056b3; display: block; margin-top: 15px;">Volver al Dashboard</a>
    </div>
</body>
</html>
